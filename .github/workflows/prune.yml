name: Prune old results

on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'

jobs:
  prune-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: repo-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          bash prune.sh

  prune-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    concurrency:
      # Do not delete assets while a repository publish is in progress.
      group: repo-publish
      cancel-in-progress: false
    container:
      image: ghcr.io/solopashachas/testrpm/buildroot:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d

      - name: Restore repository inventories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 delay=1
            until "$@"; do
              if (( attempt >= 5 )); then return 1; fi
              echo "Attempt ${attempt}/5 failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry oras login ghcr.io --password "${GH_TOKEN}" -u "${{ github.actor }}"
          mkdir -p state
          retry oras repo tags --format json "ghcr.io/${{ github.repository }}/repodata" |
            jq -r '.tags[]? | select(startswith("latest-"))' | sort -u > repodata-tags
          while IFS= read -r tag; do
            retry oras pull "ghcr.io/${{ github.repository }}/repodata:${tag}" -o .
          done < repodata-tags

      - name: Delete retired release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          find state -name retired.tsv -type f -exec cat {} + | sort -u > retired.tsv
          export GITHUB_REPOSITORY="${{ github.repository }}"
          retry() {
            local attempt=1 delay=1
            until "$@"; do
              if (( attempt >= 5 )); then return 1; fi
              echo "Attempt ${attempt}/5 failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          delete_asset() {
            local rpm="$1" tag="$2" attempt=1 delay=1 assets
            while (( attempt <= 5 )); do
              echo "Deleting ${rpm} from ${tag} (attempt ${attempt}/5)"
              if gh release delete-asset "${tag}" "${rpm}" \
                  -R "${GITHUB_REPOSITORY}" --yes; then
                return 0
              fi
              if assets="$(gh release view "${tag}" -R "${GITHUB_REPOSITORY}" \
                  --json assets -q '.assets[].name')" && \
                  ! grep -Fqx "${rpm}" <<< "${assets}"; then
                return 0
              fi
              if (( attempt >= 5 )); then return 1; fi
              echo "Retrying ${rpm} in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          export -f delete_asset
          : > prune-assets.tsv
          cut -f4 retired.tsv | sort -u | while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            retry gh release view "${tag}" -R "${GITHUB_REPOSITORY}" \
              --json assets -q '.assets[].name' | sort -u > release-assets
            awk -F '\t' -v tag="${tag}" '$4 == tag { print $1 }' retired.tsv |
              sort -u | grep -Fxf release-assets | awk -v tag="${tag}" \
                '{ print $0 "\t" tag }' >> prune-assets.tsv || true
          done
          sort -u -o prune-assets.tsv prune-assets.tsv
          parallel --halt soon,fail=1 --jobs 8 --colsep '\t' \
            delete_asset {1} {2} :::: prune-assets.tsv
