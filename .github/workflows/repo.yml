name: Create repo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
        default: 'unstable'
        type: choice
        options: [beta, unstable]
      releasever:
        description: 'Fedora release version (for example, 43)'
        required: true
        default: '44'
        type: string
      testing:
        description: 'Create/update the testing repository'
        required: false
        default: false
        type: boolean

concurrency:
  # Pages deployments replace the complete site, so publishers are serialized.
  group: repo-publish
  cancel-in-progress: false

jobs:
  repo:
    runs-on: ubuntu-latest
    container: ghcr.io/solopashachas/testrpm/buildroot:latest
    permissions:
      contents: write
      packages: write
    env:
      MAX_ASSETS_PER_RELEASE: '900'
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.event.repository.name }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Determine inputs and logical repository
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RELEASEVER: ${{ inputs.releasever }}
          INPUT_TESTING: ${{ inputs.testing }}
        run: |
          set -euo pipefail
          releasever="${INPUT_RELEASEVER#fc}"
          [[ "${releasever}" =~ ^[0-9]+$ ]] || { echo 'releasever must be numeric' >&2; exit 1; }
          normal_repository="${INPUT_BRANCH}-${releasever}"
          logical_repository="${normal_repository}"
          [[ "${INPUT_TESTING}" == true ]] && logical_repository+="-testing"
          {
            echo "branch=${INPUT_BRANCH}"
            echo "releasever=${releasever}"
            echo "testing=${INPUT_TESTING}"
            echo "normal_repository=${normal_repository}"
            echo "logical_repository=${logical_repository}"
            echo "debug_repository=${logical_repository}-debuginfo"
          } >> "${GITHUB_ENV}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d

      - name: Authenticate to GHCR
        run: oras login ghcr.io --password "${{ secrets.GITHUB_TOKEN }}" -u "${{ github.actor }}"

      - name: Restore all logical repository caches
        run: |
          set -euo pipefail
          mkdir -p repo state
          oras repo tags --format json "ghcr.io/${{ github.repository }}/repodata" 2>/dev/null |
            jq -r '.tags[]?' | grep '^latest-' > /tmp/repodata-tags || true
          while IFS= read -r tag; do
            oras pull "ghcr.io/${{ github.repository }}/repodata:${tag}" -o .
          done < /tmp/repodata-tags
          mkdir -p "repo/${logical_repository}" "repo/${debug_repository}" "state/${logical_repository}"
          touch "state/${logical_repository}/inventory.tsv"

      - name: Discover package versions
        run: .github/scripts/publish-repo.sh discover

      - name: Download new RPM artifacts
        run: .github/scripts/publish-repo.sh download

      - name: Import legacy release on first run
        run: .github/scripts/publish-repo.sh bootstrap

      - name: Determine physical release buckets
        run: .github/scripts/publish-repo.sh assign

      - name: Publish RPM release assets
        run: .github/scripts/publish-repo.sh upload

      - name: Generate complete logical repository metadata
        run: .github/scripts/publish-repo.sh metadata

      - name: Perform repoclosure
        run: |
          set -euo pipefail
          args=(--repofrompath="new,repo/${logical_repository}/" --check new --newest)
          if [[ "${testing}" == true ]]; then
            args+=(--repofrompath="base,https://${REPOSITORY_OWNER}.github.io/${REPOSITORY}/${normal_repository}/")
          fi
          dnf repoclosure "${args[@]}"
          dnf repoclosure "${args[@]}" --best

      - name: Generate .repo file
        run: .github/scripts/publish-repo.sh repofile

      - name: Validate logical repository
        run: .github/scripts/publish-repo.sh validate

      - name: Publish GHCR repodata cache
        run: |
          set -euo pipefail
          oras push "ghcr.io/${{ github.repository }}/repodata:latest-${logical_repository}" \
            "repo/${logical_repository}/repodata" \
            "repo/${logical_repository}/packages.txt" \
            "repo/${debug_repository}/repodata" \
            "state/${logical_repository}/inventory.tsv"

      - name: Prepare Pages artifact
        run: rm -rf incoming metadata-fragments merged-* primary.xml state

      - name: Upload repository metadata to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  pages:
    needs: repo
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
