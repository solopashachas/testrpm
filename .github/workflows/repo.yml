name: Create repo

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch'
        required: true
        default: 'unstable'
        type: choice
        options: [beta, unstable]
      releasever:
        description: 'Fedora release version (for example, 44)'
        required: true
        default: '44'
        type: string
      testing:
        description: 'Create/update the testing repository'
        required: false
        default: false
        type: boolean
      exclude_sources:
        description: 'Source package names or glob patterns to exclude (comma or space separated)'
        required: false
        default: 'python-ytmusicapi ktextaddons kirigami-app-components'
        type: string

concurrency:
  group: repo-publish
  cancel-in-progress: false

jobs:
  repo:
    runs-on: ubuntu-latest
    container: ghcr.io/solopashachas/testrpm/buildroot:latest
    permissions:
      contents: write
      packages: write
    env:
      MAX_ASSETS_PER_RELEASE: '900'
      MAX_PARALLEL_TRANSFERS: '8'
      EXCLUDE_SOURCES: ${{ inputs.exclude_sources }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.event.repository.name }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Determine inputs and logical repository
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RELEASEVER: ${{ inputs.releasever }}
          INPUT_TESTING: ${{ inputs.testing }}
        run: |
          set -euo pipefail
          releasever="${INPUT_RELEASEVER#fc}"
          [[ "${releasever}" =~ ^[0-9]+$ ]] || { echo 'releasever must be numeric' >&2; exit 1; }
          normal_repository="${INPUT_BRANCH}-${releasever}"
          logical_repository="${normal_repository}"
          [[ "${INPUT_TESTING}" == true ]] && logical_repository+="-testing"
          {
            echo "branch=${INPUT_BRANCH}"
            echo "releasever=${releasever}"
            echo "testing=${INPUT_TESTING}"
            echo "normal_repository=${normal_repository}"
            echo "logical_repository=${logical_repository}"
            echo "debug_repository=${logical_repository}-debuginfo"
          } >> "${GITHUB_ENV}"

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d

      - name: Authenticate to GHCR
        run: oras login ghcr.io --password "${{ secrets.GITHUB_TOKEN }}" -u "${{ github.actor }}"

      - name: Restore all logical repository caches
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 delay=1
            until "$@"; do
              if (( attempt >= 5 )); then return 1; fi
              echo "Attempt ${attempt}/5 failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          mkdir -p repo state
          retry oras repo tags --format json "ghcr.io/${{ github.repository }}/repodata" 2>/dev/null |
            jq -r '.tags[]?' | grep '^latest-' > /tmp/repodata-tags || true
          while IFS= read -r tag; do
            retry oras pull "ghcr.io/${{ github.repository }}/repodata:${tag}" -o .
          done < /tmp/repodata-tags
          mkdir -p "repo/${logical_repository}" "repo/${debug_repository}" "state/${logical_repository}"
          touch "state/${logical_repository}/inventory.tsv"
          touch "state/${logical_repository}/retired.tsv"

      - name: Discover package versions
        run: .github/scripts/publish-repo.py discover

      - name: Download new RPM artifacts
        run: .github/scripts/publish-repo.py download

      - name: Determine physical release buckets
        run: .github/scripts/publish-repo.py assign

      - name: Publish RPM release assets
        run: .github/scripts/publish-repo.py upload

      - name: Generate complete logical repository metadata
        run: .github/scripts/publish-repo.py metadata

      - name: Empty testing repository after publishing stable packages
        run: .github/scripts/publish-repo.py prune

      - name: Perform repoclosure
        run: |
          set -euo pipefail
          args=(--repofrompath="new,repo/${logical_repository}/" --check new --newest)
          if [[ "${testing}" == true ]]; then
            args+=(--repofrompath="base,https://${REPOSITORY_OWNER}.github.io/${REPOSITORY}/${normal_repository}/")
          fi
          if ! dnf repoclosure "${args[@]}"; then
            echo '::error::Repository closure check failed'
            exit 1
          fi
          if ! dnf repoclosure "${args[@]}" --best; then
            echo '::error::Repository closure check with --best failed'
            exit 1
          fi

      - name: Generate .repo file
        run: .github/scripts/publish-repo.py repofile

      - name: Validate logical repository
        run: .github/scripts/publish-repo.py validate

      - name: Publish GHCR repodata cache
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 delay=1
            until "$@"; do
              if (( attempt >= 5 )); then return 1; fi
              echo "Attempt ${attempt}/5 failed; retrying in ${delay}s" >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          retry oras push "ghcr.io/${{ github.repository }}/repodata:latest-${logical_repository}" \
            "repo/${logical_repository}/repodata" \
            "repo/${logical_repository}/packages.txt" \
            "repo/${debug_repository}/repodata" \
            "state/${logical_repository}/inventory.tsv" \
            "state/${logical_repository}/retired.tsv"
          if [[ "${testing}" != true ]]; then
            testing_repository="${normal_repository}-testing"
            retry oras push "ghcr.io/${{ github.repository }}/repodata:latest-${testing_repository}" \
              "repo/${testing_repository}/repodata" \
              "repo/${testing_repository}/packages.txt" \
              "repo/${testing_repository}-debuginfo/repodata" \
              "state/${testing_repository}/inventory.tsv" \
              "state/${testing_repository}/retired.tsv"
          fi

      - name: Prepare Pages artifact
        run: rm -rf incoming metadata-fragments merged-* primary.xml state

      - name: Upload repository metadata to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo/

  pages:
    needs: repo
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
